<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AO Sanctuary</title>
    <script>
      // Preserve the requested SPA path/query/hash and let the root app restore it.
      (function () {
        var path = window.location.pathname;
        var base = "/anom-social-sanctuary/";
        var relative = path.indexOf(base) === 0 ? path.slice(base.length) : "";
        var redirect = base + "?spa=" + encodeURIComponent("/" + relative) + window.location.search + window.location.hash;
        window.location.replace(redirect);
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to AO Sanctuary…</p>
  </body>
</html>
